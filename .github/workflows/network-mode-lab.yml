name: BRAWL isolated network-mode lab
on:
  push:
    paths:
      - 'network/lab/**'
      - 'tests/network-*.cjs'
      - '.github/workflows/network-mode-lab.yml'
  pull_request:
    paths:
      - 'network/lab/**'
      - 'tests/network-*.cjs'
      - '.github/workflows/network-mode-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-network-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 1vs1 vs 2vs2 scope and reconnect safety
        run: node tests/network-mode-isolation.cjs
      - name: Deterministic 2-player and 4-player latency/load simulation
        run: node tests/network-latency-simulation.cjs
      - name: Verify public playtest candidates do not accidentally enable Firebase networking
        run: node tests/network-public-isolation.cjs
