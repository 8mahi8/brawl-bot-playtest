  workflow_dispatch:
permissions:
  contents: read
jobs:
  friends-beta-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Validate both standalone published friend beta pages (no real Firebase writes)
        run: |
          node tests/draft-friends-beta-release.cjs
          node tests/friends-four-mode-readiness.cjs
          node scripts/build-friends-online.cjs --check
          node tests/friends-online-build.cjs
          node tests/friends-control-layout.cjs
          node tests/friends-2v2-position-cadence.cjs
          node tests/friends-2v2-position-delta-v44.cjs
          node tests/friends-2v2-position-ingest-v44.cjs
          node tests/friends-2v2-game-hud-v45.cjs
          node tests/friends-2v2-network-foundation.cjs
          node tests/friends-2v2-action-hotpath-v41.cjs
          node tests/friends-2v2-combat-presentation.cjs
          node tests/friends-input-controls-v33.cjs
          node tests/friends-touch-combat-v34.cjs
          node tests/friends-2v2-latency-probe-v35.cjs
          node tests/friends-2v2-lag-stages-v39.cjs
          node tests/friends-2v2-lag-panel-v40.cjs
          node tests/friends-2v2-visual-catchup-v37.cjs
          node tests/friends-2v2-visual-entry-v38.cjs
          node tests/friends-2v2-early-shot-index-v47.cjs
          node tests/friends-2v2-quiet-action-wake-v48.cjs
          node tests/friends-2v2-render-phases-v49.cjs
          node tests/friends-2v2-canvas-load-v50.cjs
          mkdir -p artifacts/qa
          node tests/friends-2v2-lag-stress-v36.cjs > artifacts/qa/v36-synthetic-scenarios.json
          node --check tests/friends-2v2-lag-delivery-webkit-v36.cjs
          node tests/friends-2v2-latency-visual.cjs
          node --check tests/draft-friends-beta-webkit.cjs
          node --check tests/friends-2v2-live-motion-webkit-v43.cjs
          node --check tests/friends-2v2-normal-latency-webkit.cjs
          node --check tests/friends-1v1-stable-vs-shared-webkit-v51.cjs
      - name: Generate the four friend modes from checked shared source (staging only)
        run: |
          node scripts/build-friends-online.cjs --emit
          node tests/friends-online-emit.cjs
      - name: Keep the standalone four-mode HTMLs available for manual review
        uses: actions/upload-artifact@v4
        with:
          name: brawl-friends-four-mode-staging-html
          path: artifacts/friends-online/*.html
          retention-days: 7
          if-no-files-found: error
      - name: Install Firebase local emulator and Safari-like WebKit
        run: |
          npm install --no-save --package-lock=false firebase-tools@14.24.0 playwright-core@1.56.1
          npx playwright-core install --with-deps webkit
      - name: Compare generated four-mode control UIs against old saved layouts in WebKit
        run: node tests/friends-control-layout-webkit.cjs
      - name: Pin compatible Firebase browser SDK locally for emulator
        run: |
          mkdir -p artifacts/firebase-sdk
          curl -fsSL --retry 3 --max-time 25 https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js -o artifacts/firebase-sdk/firebase-app-compat.js
          curl -fsSL --retry 3 --max-time 25 https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js -o artifacts/firebase-sdk/firebase-database-compat.js
          test -s artifacts/firebase-sdk/firebase-app-compat.js
          test -s artifacts/firebase-sdk/firebase-database-compat.js
      - name: Run 2-client and 4-client beta HTML on LOCAL RTDB emulator only
        run: ./node_modules/.bin/firebase emulators:exec --only database --project demo-brawl-draft-beta --config firebase.draft-friends-beta-e2e.json "node tests/draft-friends-beta-webkit.cjs && node tests/friends-2v2-normal-latency-webkit.cjs && node tests/friends-1v1-stable-vs-shared-webkit-v51.cjs && BRAWL_STAGE_2V2=1 BRAWL_VISUAL_QA=1 node tests/draft-friends-beta-webkit.cjs && BRAWL_STAGE_2V2=1 node tests/friends-2v2-normal-latency-webkit.cjs && BRAWL_STAGE_2V2=1 BRAWL_VISUAL_QA=1 node tests/friends-2v2-lag-delivery-webkit-v36.cjs && BRAWL_STAGE_2V2=1 node tests/friends-2v2-four-peer-pressure-v41.cjs && BRAWL_STAGE_2V2=1 node tests/friends-2v2-live-motion-webkit-v43.cjs && BRAWL_STAGE_2V2=1 BRAWL_V45_ISOLATE_CANVAS=1 node tests/friends-2v2-live-motion-webkit-v43.cjs && BRAWL_STAGE_2V2=1 BRAWL_V46_BASELINE_ACTIONS=1 node tests/friends-2v2-live-motion-webkit-v43.cjs && BRAWL_STAGE_2V2=1 BRAWL_V46_BASELINE_ACTIONS=1 BRAWL_V47_INDEX_EARLY_SHOTS=1 node tests/friends-2v2-live-motion-webkit-v43.cjs && BRAWL_STAGE_2V2=1 BRAWL_V46_BASELINE_ACTIONS=1 BRAWL_V49_RENDER_PHASES=1 node tests/friends-2v2-live-motion-webkit-v43.cjs && BRAWL_STAGE_2V2=1 BRAWL_V45_ISOLATE_CANVAS=1 BRAWL_V46_BASELINE_ACTIONS=1 BRAWL_V49_RENDER_PHASES=1 BRAWL_V50_CANVAS_CPU_SPLIT=1 node tests/friends-2v2-live-motion-webkit-v43.cjs"
      - name: Publish synthetic and four-peer delivery-lag evidence (no room IDs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brawl-v36-lag-stress-results
          path: |
            artifacts/qa/v36-*.json
            artifacts/qa/v40-*.json
            artifacts/qa/v41-*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Keep local four-person 2vs2 video for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brawl-v42-2vs2-local-video-review
          path: artifacts/qa/v42-*.webm
          retention-days: 7
          if-no-files-found: warn
      - name: Archive V4.3 moving 2vs2 video, stills, and anonymous stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brawl-v43-real-motion-visual-review
          path: |
            artifacts/qa/v43-*.webm
            artifacts/qa/v43-*.png
            artifacts/qa/v43-*.json
            artifacts/qa/v46-*.json
            artifacts/qa/v47-*.json
            artifacts/qa/v49-*.json
            artifacts/qa/v51-*.json
            artifacts/qa/v50-*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Archive V4.5 four-client Canvas load isolation (local emulator only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brawl-v45-4vs1-canvas-isolation
          path: artifacts/qa/v45-canvas-isolation-*.json
          retention-days: 7
          if-no-files-found: warn
