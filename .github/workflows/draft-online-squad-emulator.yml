name: BRAWL Tactical Draft 2vs2 KO — local emulator
on:
  push:
    paths:
      - 'online/draft-squad-online-lab.html'
      - 'draft/squad-online-prototype.inc.js'
      - 'tests/draft-online-squad-core.cjs'
      - 'tests/draft-online-squad-webkit.cjs'
      - 'firebase.draft-squad-e2e.json'
      - 'network/emulator/DRAFT_SQUAD_E2E_TEST_ONLY.rules.json'
      - '.github/workflows/draft-online-squad-emulator.yml'
  pull_request:
    paths:
      - 'online/draft-squad-online-lab.html'
      - 'draft/squad-online-prototype.inc.js'
      - 'tests/draft-online-squad-core.cjs'
      - 'tests/draft-online-squad-webkit.cjs'
      - 'firebase.draft-squad-e2e.json'
      - 'network/emulator/DRAFT_SQUAD_E2E_TEST_ONLY.rules.json'
      - '.github/workflows/draft-online-squad-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-webkit-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify squad winner-first snake and bounded card effect contracts
        run: node tests/draft-online-squad-core.cjs
      - name: Verify original 1vs1 and 2vs2 published releases frozen
        run: node tests/sites-friends-release-freeze.cjs
      - name: Verify WebKit suite syntax
        run: node --check tests/draft-online-squad-webkit.cjs
      - name: Install local Firebase CLI and Safari/WebKit
        run: |
          npm install --no-save --package-lock=false firebase-tools@14.24.0 playwright-core@1.56.1
          npx playwright-core install --with-deps webkit
      - name: Download pinned Firebase compat SDK locally
        run: |
          mkdir -p artifacts/firebase-sdk
          curl -fsSL --retry 3 --max-time 25 https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js -o artifacts/firebase-sdk/firebase-app-compat.js
          curl -fsSL --retry 3 --max-time 25 https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js -o artifacts/firebase-sdk/firebase-database-compat.js
      - name: Run four actual WebKit clients with isolated RTDB emulator (no cloud)
        run: ./node_modules/.bin/firebase emulators:exec --only database --project demo-brawl-draft --config firebase.draft-squad-e2e.json "node tests/draft-online-squad-webkit.cjs"
