name: BRAWL foundation build and regression
on:
  push:
    paths:
      - 'shared/brawl-core-contract.json'
      - 'shared/brawl-build-modes.json'
      - 'shared/runtime/**'
      - 'src/modes/**'
      - 'foundation/1v1-foundation-v1.html'
      - 'foundation/2v2-foundation-v1.html'
      - 'scripts/build-brawl.cjs'
      - 'scripts/build-open-arena-lab.cjs'
      - 'scripts/build-tank-balance-lab.cjs'
      - 'tests/foundation-*.cjs'
      - '.github/workflows/foundation-build.yml'
  pull_request:
    paths:
      - 'shared/brawl-core-contract.json'
      - 'shared/brawl-build-modes.json'
      - 'shared/runtime/**'
      - 'src/modes/**'
      - 'foundation/**'
      - 'scripts/build-brawl.cjs'
      - 'tests/foundation-*.cjs'
      - '.github/workflows/foundation-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-game-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Both generated pages must exactly match single shared contract and source templates
        run: node scripts/build-brawl.cjs --check
      - name: Independent wide-map build must exactly match foundation baseline
        run: node scripts/build-open-arena-lab.cjs --check
      - name: Tank candidate builds byte-for-byte and guard/HP mechanics match
        run: |
          node scripts/build-tank-balance-lab.cjs --check
          node tests/foundation-2v2-tank-lab.cjs
      - name: Wide-map cover symmetry and walkable routes
        run: node tests/foundation-2v2-open-arena.cjs
      - name: Prove one shared configuration edit propagates to BOTH builds
        run: node tests/foundation-build-smoke.cjs
      - name: Compare actual 1vs1 and 2vs2 weapon behavior before browser QA
        run: node tests/foundation-weapon-parity.cjs
      - name: Cross-mode shared ammunition and volley creation
        run: node tests/foundation-combat-actions-parity.cjs
      - name: Cross-mode projectile collision and damage parity
        run: node tests/foundation-projectile-parity.cjs
      - name: Shared HP, shield, KO and AREA match resolution across both modes
        run: node tests/foundation-match-state-parity.cjs
      - name: Cross-mode V8 abilities, GAD/ULT semantics and rejected actions
        run: node tests/foundation-abilities-parity.cjs
      - name: 1vs1 BOT stealth memory, scouting and fair ability decisions
        run: node tests/foundation-1v1-stealth-bot.cjs
      - name: 2vs2 gameplay and clean interface regression
        run: node tests/foundation-2v2-gameplay.cjs
      - name: Install browser runner and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - name: Generated 1vs1 desktop and tablet BOT playtest
        run: node tests/foundation-1v1-browser.cjs
      - name: Generated 2vs2 PC + three mobile UI and BOT playtests
        run: node tests/foundation-2v2-browser.cjs
      - name: Live 2vs2 HOT ZONE BOT objective play on desktop and tablet
        run: node tests/foundation-2v2-area-browser.cjs
      - name: Open Arena LAB desktop KO and tablet HOT ZONE
        run: node tests/foundation-2v2-open-arena-browser.cjs
      - name: Tank tuning candidate desktop KO and tablet HOT ZONE
        run: node tests/foundation-2v2-tank-lab-browser.cjs
      - name: Store generated-build screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brawl-foundation-1v1-2v2-screen-previews
          path: |
            artifacts/foundation-v1-*.png
            artifacts/open-arena-*.png
            artifacts/tank-lab-*.png
          if-no-files-found: ignore
          retention-days: 7
