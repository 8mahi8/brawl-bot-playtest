name: BRAWL Tactical Draft ONLINE 1vs1 (LOCAL emulator only)
on:
  push:
    paths:
      - 'online/draft-duel-online-lab.html'
      - 'draft/duel-online-prototype.inc.js'
      - 'tests/draft-online-duel-core.cjs'
      - 'tests/draft-online-duel-webkit.cjs'
      - 'firebase.draft-online-e2e.json'
      - 'network/emulator/DRAFT_ONLINE_E2E_TEST_ONLY.rules.json'
      - '.github/workflows/draft-online-duel-emulator.yml'
  pull_request:
    paths:
      - 'online/draft-duel-online-lab.html'
      - 'draft/duel-online-prototype.inc.js'
      - 'tests/draft-online-duel-core.cjs'
      - 'tests/draft-online-duel-webkit.cjs'
      - 'firebase.draft-online-e2e.json'
      - 'network/emulator/DRAFT_ONLINE_E2E_TEST_ONLY.rules.json'
      - '.github/workflows/draft-online-duel-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-safari-like-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check pure draft protocol, card effects and standalone HTML syntax
        run: node tests/draft-online-duel-core.cjs
      - name: Confirm public releases remain frozen
        run: node tests/sites-friends-release-freeze.cjs
      - name: Verify two-browser E2E script syntax
        run: node --check tests/draft-online-duel-webkit.cjs
      - name: Install Firebase emulator CLI and WebKit
        run: |
          npm install --no-save --package-lock=false firebase-tools@14.24.0 playwright-core@1.56.1
          npx playwright-core install --with-deps webkit
      - name: Download pinned Firebase compat SDK locally
        run: |
          mkdir -p artifacts/firebase-sdk
          curl -fsSL --retry 3 --max-time 25 https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js -o artifacts/firebase-sdk/firebase-app-compat.js
          curl -fsSL --retry 3 --max-time 25 https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js -o artifacts/firebase-sdk/firebase-database-compat.js
          test -s artifacts/firebase-sdk/firebase-app-compat.js
          test -s artifacts/firebase-sdk/firebase-database-compat.js
      - name: Play four online draft rounds across two real WebKit clients and local RTDB
        run: ./node_modules/.bin/firebase emulators:exec --only database --project demo-brawl-draft --config firebase.draft-online-e2e.json "node tests/draft-online-duel-webkit.cjs"
