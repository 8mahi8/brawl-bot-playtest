name: BRAWL 1vs1 and 2vs2 Google Sites iPad WebKit QA
on:
  push:
    paths:
      - 'sites/1vs1-ipad-bot-embed.html'
      - 'sites/2vs2-ipad-bot-embed.html'
      - 'tests/sites-2v2-webkit-embed.cjs'
      - 'sites/1vs1-ipad-diagnostic-v2.html'
      - 'sites/1vs1-ipad-stable-v1.html'
      - 'sites/2vs2-ipad-diagnostic-v1.html'
      - 'sites/2vs2-ipad-ko-scout-v1.html'
      - 'sites/1vs1-ipad-playtest-v2.html'
      - 'sites/2vs2-ipad-playtest-v2.html'
      - 'tests/sites-ipad-polish-layout.cjs'
      - 'tests/sites-2v2-ko-scout.cjs'
      - 'tests/sites-ipad-candidate-parity.cjs'
      - 'tests/sites-1v1-webkit-embed.cjs'
      - '.github/workflows/sites-1v1-webkit-embed.yml'
  pull_request:
    paths:
      - 'sites/1vs1-ipad-bot-embed.html'
      - 'sites/2vs2-ipad-bot-embed.html'
      - 'tests/sites-2v2-webkit-embed.cjs'
      - 'sites/1vs1-ipad-diagnostic-v2.html'
      - 'sites/1vs1-ipad-stable-v1.html'
      - 'sites/2vs2-ipad-diagnostic-v1.html'
      - 'sites/2vs2-ipad-ko-scout-v1.html'
      - 'sites/1vs1-ipad-playtest-v2.html'
      - 'sites/2vs2-ipad-playtest-v2.html'
      - 'tests/sites-ipad-polish-layout.cjs'
      - 'tests/sites-2v2-ko-scout.cjs'
      - 'tests/sites-ipad-candidate-parity.cjs'
      - 'tests/sites-1v1-webkit-embed.cjs'
      - '.github/workflows/sites-1v1-webkit-embed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandboxed-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install iPad Safari engine
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
          npx playwright-core install --with-deps webkit
      - name: Keep gameplay scripts identical to release source
        run: node tests/sites-ipad-candidate-parity.cjs
      - name: Compare original, diagnostic and stable 1vs1 in restricted iframes
        run: node tests/sites-1v1-webkit-embed.cjs
      - name: Test original and diagnostic 2vs2 KO and AREA in WebKit iPad iframes
        run: node tests/sites-2v2-webkit-embed.cjs
      - name: KO spectator and concealed-opponent regression
        run: node tests/sites-2v2-ko-scout.cjs
      - name: iPad polished UI layout screenshots and interactive hit targets
        run: node tests/sites-ipad-polish-layout.cjs
      - name: Store polished layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brawl-ipad-combat-polish-screens
          path: artifacts/ipad-polish-*.png
          if-no-files-found: ignore
