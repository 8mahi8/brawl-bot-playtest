name: BRAWL real multi-browser online E2E (LOCAL emulator only)
on:
  push:
    paths:
      - 'online/ipad-duel-v2-lab.html'
      - 'online/ipad-squad-v2-lab.html'
      - 'tests/online-ipad-v2-emulator-browser.cjs'
      - 'tests/online-remote-presentation.cjs'
      - 'tests/online-host-fast-dispatch.cjs'
      - 'tests/online-frame-rate-accuracy.cjs'
      - 'tests/online-periodic-hud-coalesce.cjs'
      - 'tests/online-touch-input-latency.cjs'
      - 'tests/online-2v2-canvas-pixel-budget.cjs'
      - 'tests/online-idle-position-traffic.cjs'
      - 'tests/online-2v2-static-arena-cache.cjs'
      - 'tests/online-hp-preview.cjs'
      - 'tests/online-host-action-batching.cjs'
      - 'tests/online-host-txn-arbiter.cjs'
      - 'tests/online-guardian-null-hit.cjs'
      - 'firebase.online-e2e.json'
      - 'network/emulator/ONLINE_E2E_TEST_ONLY.rules.json'
      - '.github/workflows/online-ipad-v2-real-emulator.yml'
  pull_request:
    paths:
      - 'online/ipad-duel-v2-lab.html'
      - 'online/ipad-squad-v2-lab.html'
      - 'tests/online-ipad-v2-emulator-browser.cjs'
      - 'tests/online-remote-presentation.cjs'
      - 'tests/online-host-fast-dispatch.cjs'
      - 'tests/online-frame-rate-accuracy.cjs'
      - 'tests/online-periodic-hud-coalesce.cjs'
      - 'tests/online-touch-input-latency.cjs'
      - 'tests/online-2v2-canvas-pixel-budget.cjs'
      - 'tests/online-idle-position-traffic.cjs'
      - 'tests/online-2v2-static-arena-cache.cjs'
      - 'tests/online-hp-preview.cjs'
      - 'tests/online-host-action-batching.cjs'
      - 'tests/online-host-txn-arbiter.cjs'
      - 'tests/online-guardian-null-hit.cjs'
      - 'firebase.online-e2e.json'
      - 'network/emulator/ONLINE_E2E_TEST_ONLY.rules.json'
      - '.github/workflows/online-ipad-v2-real-emulator.yml'
  workflow_dispatch:
concurrency:
  group: brawl-real-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  actual-webkit-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify 2vs2 bush-fog backdrop cache and Safari no-canvas fallback
        run: node tests/online-2v2-static-arena-cache.cjs
      - name: Verify mobile movement and stationary RTDB position publication
        run: node tests/online-idle-position-traffic.cjs
      - name: Verify 2vs2 tablet Canvas memory budget and phone quality
        run: node tests/online-2v2-canvas-pixel-budget.cjs
      - name: Verify Safari touch event queue timestamp and input attribution
        run: node tests/online-touch-input-latency.cjs
      - name: Verify periodic HUD coalescing without slowing authoritative state updates
        run: node tests/online-periodic-hud-coalesce.cjs
      - name: Verify actual FPS telemetry with clamped simulation delta
        run: node tests/online-frame-rate-accuracy.cjs
      - name: Verify visual-only position prediction and HTML syntax
        run: node tests/online-remote-presentation.cjs
      - name: Verify responsive 2vs2 shot dispatch gating and HTML syntax
        run: node tests/online-host-fast-dispatch.cjs
      - name: Verify 2vs2 provisional HUD hit feedback and reconciliation
        run: node tests/online-hp-preview.cjs
      - name: Verify bounded host-action batching and transaction safety
        run: node tests/online-host-action-batching.cjs
      - name: Verify shot-priority host game transaction arbiter
        run: node tests/online-host-txn-arbiter.cjs
      - name: Verify Firebase-safe null guardian in 2vs2 hit events
        run: node tests/online-guardian-null-hit.cjs
      - name: Install local Firebase emulator CLI and WebKit
        run: |
          npm install --no-save --package-lock=false firebase-tools@14.24.0 playwright-core@1.56.1
          npx playwright-core install --with-deps webkit
      - name: Download pinned Firebase compat browser SDK to LOCAL CI fixture
        run: |
          mkdir -p artifacts/firebase-sdk
          curl -fsSL --retry 3 --max-time 25 https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js -o artifacts/firebase-sdk/firebase-app-compat.js
          curl -fsSL --retry 3 --max-time 25 https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js -o artifacts/firebase-sdk/firebase-database-compat.js
          test -s artifacts/firebase-sdk/firebase-app-compat.js
          test -s artifacts/firebase-sdk/firebase-database-compat.js
      - name: Start LOCAL RTDB emulator and exercise two and four real browser clients
        run: ./node_modules/.bin/firebase emulators:exec --only database --project demo-brawl-online --config firebase.online-e2e.json "node tests/online-ipad-v2-emulator-browser.cjs"
