name: BRAWL Draft staging RTDB AuthZ — adversarial emulator only
on:
  push:
    paths:
      - 'network/staging/DRAFT_AUTHZ_INPUT_GATE_TEST_ONLY.rules.json'
      - 'firebase.draft-staging-authz-e2e.json'
      - 'tests/draft-staging-authz-emulator.cjs'
      - 'draft/trusted-match-core.cjs'
      - 'draft/trusted-match-service.cjs'
      - 'tests/draft-trusted-match-core.cjs'
      - 'tests/draft-trusted-match-emulator.cjs'
      - '.github/workflows/draft-staging-authz.yml'
  pull_request:
    paths:
      - 'network/staging/DRAFT_AUTHZ_INPUT_GATE_TEST_ONLY.rules.json'
      - 'firebase.draft-staging-authz-e2e.json'
      - 'tests/draft-staging-authz-emulator.cjs'
      - 'draft/trusted-match-core.cjs'
      - 'draft/trusted-match-service.cjs'
      - 'tests/draft-trusted-match-core.cjs'
      - 'tests/draft-trusted-match-emulator.cjs'
      - '.github/workflows/draft-staging-authz.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unauthenticated-and-tamper-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify original public release stays frozen
        run: node tests/sites-friends-release-freeze.cjs
      - name: Validate security-rules test script syntax and stage-only config
        run: |
          node --check tests/draft-staging-authz-emulator.cjs
          node --check tests/draft-trusted-match-core.cjs
          node --check tests/draft-trusted-match-emulator.cjs
          node --check draft/trusted-match-core.cjs
          node --check draft/trusted-match-service.cjs
          node tests/draft-trusted-match-core.cjs
          node -e "const f=require('./firebase.draft-staging-authz-e2e.json');if(f.database.rules!=='network/staging/DRAFT_AUTHZ_INPUT_GATE_TEST_ONLY.rules.json'||f.emulators.database.host!=='127.0.0.1')process.exit(1)"
      - name: Install pinned Firebase emulator and auth rules testing SDK
        run: npm install --no-save --package-lock=false firebase-tools@14.24.0 firebase@12.5.0 @firebase/rules-unit-testing@5.0.0
      - name: Run malicious writes / authorized rejoin against demo RTDB emulator
        run: ./node_modules/.bin/firebase emulators:exec --only database --project demo-brawl-draft-staging-authz --config firebase.draft-staging-authz-e2e.json "node tests/draft-staging-authz-emulator.cjs && node tests/draft-trusted-match-emulator.cjs"
